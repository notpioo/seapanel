<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - {{PAGE_TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /*CSS_INJECT_HERE*/
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"
                    style="font-size: 64px; margin-bottom: 16px; background: linear-gradient(45deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));">
                    ⚔️</div>
                <h1 class="login-title">NoMercy</h1>
                <p class="login-subtitle">Create your account</p>
            </div>

            {{ERROR_MESSAGE}}
            {{SUCCESS_MESSAGE}}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required
                        autofocus minlength="3" maxlength="20">
                    <small style="color: #6b7280; font-size: 12px;">3-20 characters, letters and numbers only</small>
                </div>

                <div class="form-group">
                    <label class="form-label">WhatsApp Number</label>
                    <input type="tel" name="phoneNumber" class="form-input" placeholder="e.g. 081234567890" required
                        pattern="^(08|628)\d{8,13}$">
                    <small style="color: #6b7280; font-size: 12px;">Format: 08xx or 628xx (Required for game
                        data)</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Create a password" required
                        minlength="6">
                    <small style="color: #6b7280; font-size: 12px;">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-input" placeholder="Confirm your password"
                        required>
                </div>

                <button type="submit" class="login-btn">Create Account</button>
            </form>

            <div style="text-align: center; margin-top: 16px;">
                <a href="/login" style="color: #6366f1; text-decoration: none; font-size: 14px;">
                    Already have an account? Sign in
                </a>
            </div>
        </div>
    </div>
</body>

</html>

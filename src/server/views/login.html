<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{PAGE_TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /*CSS_INJECT_HERE*/
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"
                    style="font-size: 64px; margin-bottom: 16px; background: linear-gradient(45deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));">
                    ⚔️</div>
                <h1 class="login-title">NoMercy</h1>
                <p class="login-subtitle">Sign in to access the dashboard</p>
            </div>

            {{ERROR_MESSAGE}}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Enter username" required
                        autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter password" required>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 16px;">
                <a href="/register" style="color: #6366f1; text-decoration: none; font-size: 14px;">
                    Don't have an account? Register here
                </a>
            </div>
        </div>
    </div>
</body>

</html>
